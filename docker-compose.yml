services:
  agrotoken:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEMO_MODE: "true"
      DATABASE_PATH: /app/data/agrotoken.db
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
    volumes:
      - agrotoken_data:/app/data
volumes:
  agrotoken_data:
